name: Deploy to Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to the server via SSM
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          params=$(jq -n \
            --arg compose "$(base64 -w0 deploy/docker-compose.yml)" \
            --arg caddy "$(base64 -w0 deploy/Caddyfile)" \
            --arg script "$(base64 -w0 deploy/deploy.sh)" \
            --arg image "$IMAGE" \
            '{commands: [
              "set -e",
              "echo \($compose) | base64 -d > /opt/booklist/docker-compose.yml",
              "echo \($caddy) | base64 -d > /opt/booklist/Caddyfile",
              "echo \($script) | base64 -d > /opt/booklist/deploy.sh",
              "chmod +x /opt/booklist/deploy.sh",
              "/opt/booklist/deploy.sh \($image)"
            ]}')

          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "booklist ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "SSM status: $status"
          [ "$status" = "Success" ]

      - name: Smoke test
        if: ${{ vars.SITE_URL != '' }}
        run: |
          for _ in $(seq 1 12); do
            curl -fsS -o /dev/null "${{ vars.SITE_URL }}/" && { echo "Site is up"; exit 0; }
            sleep 5
          done
          echo "Site did not respond at ${{ vars.SITE_URL }}" && exit 1
